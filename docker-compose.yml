services:
  behify-browser-bot:
    build:
      context: .
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./downloads:/app/downloads
    ports:
      - "127.0.0.1:18080:8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
